name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The installed-wheel test builds this project with --no-build-isolation,
      # so the build backend has to be present in the runner environment.
      - name: Install build dependencies
        run: python -m pip install 'setuptools>=68' wheel
      - name: Run the unit tests
        run: python -m unittest discover -q
      - name: Reject whitespace errors
        run: git diff --check

  artifacts:
    name: artifact drift and determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Hard failure when a declared claim value changes: the committed result
      # no longer follows from the code. A shape change is reported as a
      # warning, because adding a field is normal and the remedy is to
      # regenerate and recommit rather than to block the change.
      - name: Drift — committed artifacts versus regenerated ones
        run: python check_artifacts.py drift

      # Independent of the committed copies: run each experiment twice in one
      # environment and require the declared paths to agree. Catches an
      # unseeded generator or an order-dependent traversal entering the
      # pipeline, which the drift check alone would not notice.
      - name: Determinism — two runs in one environment
        run: python check_artifacts.py determinism
