[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma-attack"
version = "0.1.0"
description = "Reproducible standard-Enigma baseline for the Ultimate Enigma Challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The batched stecker climb; without it the pure-Python climb runs unchanged.
fast = ["numpy"]

[project.scripts]
enigma-phase1 = "phase1:main"
enigma-phase2 = "phase2:main"
enigma-phase3 = "phase3:main"
enigma-phase4 = "phase4:main"
enigma-phase5 = "phase5:main"
enigma-phase6 = "phase6:main"
enigma-phase7 = "phase7:main"
enigma-phase1-stecker = "phase1_stecker:main"

[tool.setuptools]
py-modules = [
    "enigma",
    "enigma_fast",
    "ic_null",
    "phase1",
    "phase1_stecker",
    "phase2",
    "phase3",
    "phase4",
    "phase5",
    "phase6",
    "phase7",
    "provenance",
    "recon",
    "resources",
    "stecker_batch",
    "stecker_calibration",
    "stecker_climb",
    "stecker_controls",
    "stecker_power",
    "stecker_scoring",
    "stecker_space",
    "stecker_sweeps",
    "stecker_traffic",
]

[tool.setuptools.data-files]
"share/enigma-attack" = ["corpus.json", "cribs.json", "variants.json", "cipher-families.json"]
"share/enigma-attack/artifacts" = ["artifacts/phase3-variant-smoke.json", "artifacts/phase3-variant-smoke-v2.json", "artifacts/phase4-joint-machine-smoke.v2.json", "artifacts/phase5-model-triage.json", "artifacts/phase6-qtxma-double-transposition-smoke.json", "artifacts/phase6-qtxma-double-transposition-smoke.v2.json", "artifacts/phase7-qtxma-source-and-scorer.v2.json"]
"share/enigma-attack/experiments/phase1-stecker-calibration-v1" = ["experiments/phase1-stecker-calibration-v1/config.json"]
"share/enigma-attack/experiments/phase1-indicator-sweep-v1" = ["experiments/phase1-indicator-sweep-v1/config.json"]
"share/enigma-attack/experiments/phase1-body-direct-sweep-v1" = ["experiments/phase1-body-direct-sweep-v1/config.json"]
"share/enigma-attack/experiments/phase1-end-to-end-power-v1" = ["experiments/phase1-end-to-end-power-v1/config.json"]
"share/enigma-attack/experiments/phase4-joint-machine-smoke-v1" = ["experiments/phase4-joint-machine-smoke-v1/config.json"]
"share/enigma-attack/experiments/phase4-joint-machine-smoke-v2" = ["experiments/phase4-joint-machine-smoke-v2/config.json"]
"share/enigma-attack/experiments/phase6-qtxma-double-transposition-smoke-v1" = ["experiments/phase6-qtxma-double-transposition-smoke-v1/config.json"]
"share/enigma-attack/experiments/phase6-qtxma-double-transposition-smoke-v2" = ["experiments/phase6-qtxma-double-transposition-smoke-v2/config.json"]
"share/enigma-attack/experiments/phase7-qtxma-source-and-scorer-v1" = ["experiments/phase7-qtxma-source-and-scorer-v1/config.json"]
"share/enigma-attack/experiments/phase7-qtxma-source-and-scorer-v2" = ["experiments/phase7-qtxma-source-and-scorer-v2/config.json"]
"share/enigma-attack/data/phase5" = ["data/phase5/army-plaintext-controls.json"]
"share/enigma-attack/data/phase7" = ["data/phase7/BigramFrequency1941.txt", "data/phase7/TrigramFrequency1941.txt"]
